<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FastTracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap');

  :root {
    --bg: #0a0a0f;
    --bg2: #111118;
    --bg3: #1a1a24;
    --card: #16161f;
    --border: #2a2a3a;
    --accent: #7c6af7;
    --accent2: #4ecdc4;
    --accent3: #ff6b6b;
    --accent4: #ffd93d;
    --text: #e8e8f0;
    --text2: #9090a8;
    --text3: #5a5a72;
    --glow: rgba(124,106,247,0.15);
    --green: #56e39f;
    --orange: #ff9f43;
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    height: 100%;
    overflow: hidden;
  }

  #app {
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* NAV */
  .nav {
    display: flex;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .nav-btn {
    flex: 1;
    padding: 14px 8px;
    background: none;
    border: none;
    color: var(--text3);
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    text-transform: uppercase;
  }
  .nav-btn .icon { font-size: 18px; }
  .nav-btn.active { color: var(--accent); border-top: 2px solid var(--accent); }

  /* PAGES */
  .page { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding-bottom: 20px; }
  .page.active { display: flex; }

  /* TIMER PAGE */
  .timer-page {
    align-items: center;
    padding: 24px 20px;
    gap: 24px;
    background: radial-gradient(ellipse at 50% 20%, rgba(124,106,247,0.06) 0%, transparent 60%);
  }

  .status-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 18px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .status-badge.fasting { background: rgba(124,106,247,0.15); color: var(--accent); border: 1px solid rgba(124,106,247,0.3); }
  .status-badge.eating { background: rgba(86,227,159,0.12); color: var(--green); border: 1px solid rgba(86,227,159,0.25); }
  .pulse-dot { width: 8px; height: 8px; border-radius: 50%; animation: pulse 2s infinite; }
  .fasting .pulse-dot { background: var(--accent); }
  .eating .pulse-dot { background: var(--green); }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  /* RING */
  .ring-container {
    position: relative;
    width: 240px;
    height: 240px;
  }
  .ring-svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: var(--bg3); stroke-width: 10; }
  .ring-progress {
    fill: none;
    stroke-width: 10;
    stroke-linecap: round;
    stroke-dasharray: 659;
    stroke-dashoffset: 659;
    transition: stroke-dashoffset 1s ease, stroke 0.5s ease;
  }
  .ring-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }
  .timer-display {
    font-family: 'Space Mono', monospace;
    font-size: 38px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -1px;
    line-height: 1;
  }
  .timer-label { font-size: 11px; color: var(--text3); letter-spacing: 1px; text-transform: uppercase; }
  .timer-goal { font-size: 12px; color: var(--accent); margin-top: 2px; }

  /* PHASE BANNER */
  .phase-banner {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 20px;
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }
  .phase-icon { font-size: 28px; flex-shrink: 0; }
  .phase-title { font-size: 13px; font-weight: 600; color: var(--accent2); margin-bottom: 4px; letter-spacing: 0.3px; }
  .phase-desc { font-size: 12px; color: var(--text2); line-height: 1.5; }

  /* CONTROLS */
  .controls { display: flex; gap: 12px; width: 100%; }
  .btn-main {
    flex: 1;
    padding: 18px;
    border: none;
    border-radius: 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.3px;
  }
  .btn-main:active { transform: scale(0.97); }
  .btn-start { background: var(--accent); color: white; box-shadow: 0 4px 20px rgba(124,106,247,0.35); }
  .btn-stop { background: var(--card); color: var(--accent3); border: 1px solid rgba(255,107,107,0.3); }
  .btn-goal { background: var(--card); color: var(--text2); border: 1px solid var(--border); flex: 0 0 auto; padding: 18px 16px; border-radius: 16px; }

  /* GOAL PICKER */
  .goal-picker {
    display: none;
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
  }
  .goal-picker.open { display: block; }
  .goal-picker-title { font-size: 12px; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
  .goal-options { display: flex; flex-wrap: wrap; gap: 8px; }
  .goal-opt {
    padding: 8px 14px;
    border-radius: 100px;
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text2);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .goal-opt.selected { background: rgba(124,106,247,0.15); border-color: var(--accent); color: var(--accent); }

  /* INSIGHTS PAGE */
  .page-inner { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .section-title {
    font-size: 11px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .insight-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    display: flex;
    gap: 14px;
    align-items: flex-start;
  }
  .insight-icon { font-size: 24px; flex-shrink: 0; margin-top: 2px; }
  .insight-category {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .bio .insight-category { color: var(--accent2); }
  .mental .insight-category { color: var(--accent4); }
  .physical .insight-category { color: var(--orange); }
  .insight-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .insight-body { font-size: 12px; color: var(--text2); line-height: 1.6; }

  .timeline-bar {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    overflow: hidden;
  }
  .timeline-track { position: relative; margin-top: 12px; }
  .timeline-line {
    height: 4px;
    background: var(--bg3);
    border-radius: 2px;
    position: relative;
    overflow: hidden;
  }
  .timeline-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    transition: width 1s ease;
  }
  .timeline-markers {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
  }
  .t-marker { text-align: center; }
  .t-marker-h { font-size: 10px; color: var(--text3); font-family: 'Space Mono', monospace; }
  .t-marker-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--bg3);
    margin: 4px auto 0;
  }
  .t-marker.reached .t-marker-dot { background: var(--accent); }
  .t-marker.reached .t-marker-h { color: var(--accent); }

  /* STATS */
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
  }
  .stat-value { font-family: 'Space Mono', monospace; font-size: 24px; font-weight: 700; color: var(--text); }
  .stat-unit { font-size: 12px; color: var(--text3); margin-left: 3px; }
  .stat-label { font-size: 11px; color: var(--text2); margin-top: 4px; }

  /* HISTORY PAGE */
  .history-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    gap: 12px;
    color: var(--text3);
    font-size: 14px;
    padding: 40px;
    text-align: center;
  }
  .history-empty .big-icon { font-size: 48px; opacity: 0.4; }

  .history-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .h-date { font-size: 12px; color: var(--text3); margin-bottom: 4px; }
  .h-duration { font-family: 'Space Mono', monospace; font-size: 18px; font-weight: 700; color: var(--text); }
  .h-badge {
    padding: 6px 12px;
    border-radius: 100px;
    font-size: 11px;
    font-weight: 600;
  }
  .h-badge.great { background: rgba(86,227,159,0.12); color: var(--green); }
  .h-badge.good { background: rgba(124,106,247,0.12); color: var(--accent); }
  .h-badge.ok { background: rgba(255,159,67,0.12); color: var(--orange); }

  .streak-banner {
    background: linear-gradient(135deg, rgba(124,106,247,0.15), rgba(78,205,196,0.1));
    border: 1px solid rgba(124,106,247,0.25);
    border-radius: 16px;
    padding: 18px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .streak-num {
    font-family: 'Space Mono', monospace;
    font-size: 36px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }
  .streak-label { font-size: 12px; color: var(--text2); }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 0; }

  /* Animations */
  @keyframes fadeUp {
    from { opacity:0; transform: translateY(12px); }
    to { opacity:1; transform: translateY(0); }
  }
  .page.active .insight-card,
  .page.active .stat-card,
  .page.active .history-item {
    animation: fadeUp 0.3s ease forwards;
  }
</style>
</head>
<body>
<div id="app">

  <!-- NAVIGATION -->
  <div class="nav">
    <button class="nav-btn active" onclick="showPage('timer')" id="nav-timer">
      <span class="icon">⏱️</span>Timer
    </button>
    <button class="nav-btn" onclick="showPage('insights')" id="nav-insights">
      <span class="icon">🧬</span>Insights
    </button>
    <button class="nav-btn" onclick="showPage('history')" id="nav-history">
      <span class="icon">📊</span>History
    </button>
  </div>

  <!-- TIMER PAGE -->
  <div class="page timer-page active" id="page-timer">
    <div id="status-badge" class="status-badge eating">
      <div class="pulse-dot"></div>
      <span id="status-text">Not Fasting</span>
    </div>

    <div class="ring-container">
      <svg class="ring-svg" viewBox="0 0 220 220">
        <circle class="ring-bg" cx="110" cy="110" r="105"/>
        <circle class="ring-progress" id="ring-prog" cx="110" cy="110" r="105"/>
      </svg>
      <div class="ring-center">
        <div class="timer-display" id="timer-display">00:00:00</div>
        <div class="timer-label" id="timer-label">tap start to begin</div>
        <div class="timer-goal" id="timer-goal"></div>
      </div>
    </div>

    <div class="phase-banner" id="phase-banner">
      <div class="phase-icon">🍽️</div>
      <div>
        <div class="phase-title">Ready to Fast</div>
        <div class="phase-desc">Start your fast to see real-time biological insights as your body transitions through fasting phases.</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn-main btn-start" id="main-btn" onclick="toggleFast()">Start Fast</button>
      <button class="btn-main btn-goal" onclick="toggleGoalPicker()">🎯</button>
    </div>

    <div class="goal-picker" id="goal-picker">
      <div class="goal-picker-title">Fasting Goal</div>
      <div class="goal-options" id="goal-options"></div>
    </div>
  </div>

  <!-- INSIGHTS PAGE -->
  <div class="page" id="page-insights">
    <div class="page-inner">
      <div class="section-title">Your Progress Timeline</div>
      <div class="timeline-bar">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:13px;font-weight:600;color:var(--text)">Fasting Journey</span>
          <span id="insight-time" style="font-family:'Space Mono',monospace;font-size:13px;color:var(--accent)">0h 0m</span>
        </div>
        <div class="timeline-track">
          <div class="timeline-line">
            <div class="timeline-fill" id="tl-fill" style="width:0%"></div>
          </div>
          <div class="timeline-markers" id="tl-markers"></div>
        </div>
      </div>

      <div class="section-title">Biological Changes</div>
      <div id="bio-insights"></div>

      <div class="section-title">Mental State</div>
      <div id="mental-insights"></div>

      <div class="section-title">Physical Changes</div>
      <div id="physical-insights"></div>
    </div>
  </div>

  <!-- HISTORY PAGE -->
  <div class="page" id="page-history">
    <div class="page-inner" id="history-content">
    </div>
  </div>

</div>

<script>
// ============================================================
// STORAGE (SharedPreferences via Android bridge or localStorage fallback)
// ============================================================
const Storage = {
  get(key) {
    try {
      if (window.AndroidStorage) return window.AndroidStorage.getItem(key);
      return localStorage.getItem(key);
    } catch(e) { return localStorage.getItem(key); }
  },
  set(key, value) {
    try {
      if (window.AndroidStorage) window.AndroidStorage.setItem(key, value);
      else localStorage.setItem(key, value);
    } catch(e) { localStorage.setItem(key, value); }
  },
  remove(key) {
    try {
      if (window.AndroidStorage) window.AndroidStorage.removeItem(key);
      else localStorage.removeItem(key);
    } catch(e) { localStorage.removeItem(key); }
  }
};

// ============================================================
// FASTING PHASES DATA
// ============================================================
const PHASES = [
  {
    hour: 0, icon: '🍽️',
    title: 'Fed State',
    desc: 'Your body is digesting and absorbing nutrients. Insulin levels are elevated, glucose is the primary fuel.',
    bio: { title: 'Digestion & Absorption', body: 'Insulin is high, signaling cells to absorb glucose. The liver converts excess glucose to glycogen. No fat burning yet — your body has plenty of fuel from your last meal.' },

    physical: { title: 'Normal Energy', body: 'Energy is stable, temperature slightly elevated as digestion generates heat (thermogenic effect of food). Gut is actively working.' }
  },
  {
    hour: 2, icon: '🔄',
    title: 'Transition Phase',
    desc: 'Insulin starts declining. Your body begins shifting away from burning glucose from your last meal.',
    bio: { title: 'Insulin Declining', body: 'Blood glucose is normalizing. Glucagon begins to rise, signaling the liver to start releasing stored glycogen. The body prepares to tap stored energy.' },
    mental: { title: 'Mental Clarity Building', body: 'As insulin drops, the brain\'s glucose supply stabilizes. Many people notice a mild increase in alertness as the post-meal fog lifts.' },
    physical: { title: 'Subtle Hunger Signals', body: 'Ghrelin (hunger hormone) may begin a mild rise. This is normal — the body is checking in. Stomach begins emptying completely.' }
  },
  {
    hour: 4, icon: '🔥',
    title: 'Glycogen Depletion Begins',
    desc: 'Stored liver glycogen is being used. Your metabolism is ramping up fat utilization.',
    bio: { title: 'Glycogenolysis Active', body: 'The liver breaks down glycogen to maintain blood sugar. Free fatty acids start entering the bloodstream as backup fuel. Insulin is at basal levels.' },
    mental: { title: 'Steady Alertness', body: 'Norepinephrine starts a gentle rise — an evolutionary adaptation that sharpens focus during food scarcity. Ancestors needed sharper minds when hunting.' },
    physical: { title: 'Mild Hunger Waves', body: 'Hunger typically peaks and passes in waves. Drinking water helps. Stored glycogen provides steady energy — no need to panic-eat yet.' }
  },
  {
    hour: 8, icon: '⚡',
    title: 'Fat Burning Initiated',
    desc: 'Glycogen stores are depleting. Fat oxidation is increasing. Lipolysis is in full swing.',
    bio: { title: 'Lipolysis Accelerating', body: 'Triglycerides in fat cells are being broken down into glycerol and fatty acids. The liver begins converting some fatty acids to ketones — early ketogenesis. Growth hormone starts rising to preserve muscle.' },
    mental: { title: 'Norepinephrine Surge', body: 'Brain-derived neurotrophic factor (BDNF) begins increasing, which supports neuroplasticity. Many fasters report heightened concentration and motivation around this window.' },
    physical: { title: 'Metabolic Switch', body: 'You may feel a brief energy dip as your body transitions fuel sources, followed by a second wind. Hunger may paradoxically decrease as ketone production begins.' }
  },
  {
    hour: 12, icon: '🌟',
    title: 'Ketosis Entry',
    desc: 'Your liver is producing meaningful ketones. You\'re approaching metabolic ketosis — a powerful state of fat-adapted energy.',
    bio: { title: 'Ketone Production Rising', body: 'Beta-hydroxybutyrate (BHB) levels are rising. These ketones cross the blood-brain barrier and fuel neurons more efficiently than glucose. Insulin is at its lowest point, maximizing fat mobilization.' },
    mental: { title: 'The Fasting Clarity', body: 'Ketones are a premium brain fuel. Many people experience what\'s described as a "crystal clear" mind — reduced mental chatter, heightened focus, and a calm, grounded energy.' },
    physical: { title: 'True Fat Burning', body: 'Fat oxidation is now your dominant energy pathway. Inflammation markers begin decreasing. Some people notice slightly reduced joint stiffness. Body temperature regulation improves.' }
  },
  {
    hour: 16, icon: '🧹',
    title: 'Autophagy Accelerating',
    desc: 'Cellular cleanup is in full effect. Your cells are recycling damaged components — a profound anti-aging mechanism.',
    bio: { title: 'Autophagy Ramping Up', body: 'AMPK is highly activated, triggering autophagy — your cells\' self-cleaning process. Damaged proteins, mitochondria, and cellular debris are being recycled. This is linked to longevity, cancer prevention, and disease resilience.' },
    mental: { title: 'Deep Cognitive Enhancement', body: 'BDNF is significantly elevated, supporting memory consolidation and new neural connections. Dopamine receptor sensitivity may increase, making rewards more satisfying after the fast.' },
    physical: { title: 'Cellular Renewal', body: 'Growth hormone peaks dramatically (up to 2-3x baseline in men). This preserves lean muscle mass while fat burning continues. Energy is often surprisingly high — running on clean ketone fuel.' }
  },
  {
    hour: 24, icon: '🦋',
    title: 'Deep Cellular Repair',
    desc: 'Full autophagy, immune regeneration, and deep metabolic reset. This is the most profound fasting territory.',
    bio: { title: 'Immune System Regeneration', body: 'Stem cell production begins upregulating. Damaged immune cells are cleared and replaced. IGF-1 drops significantly, reducing cell proliferation and increasing cellular repair. Sirtuins (longevity proteins) are maximally activated.' },
    mental: { title: 'Transcendent Clarity', body: 'Some people report a euphoric, meditative quality to 24h+ fasting. Reduced neuroinflammation combined with peak BDNF and ketones creates a unique cognitive state. Ancient traditions called this "fasting clarity."' },
    physical: { title: 'Maximum Fat Adaptation', body: 'Your body is operating in full fat-burning mode. Insulin is near zero. Every cell is running on ketones. Anti-inflammatory cytokines are elevated. Deep tissue repair is underway.' }
  }
];

const GOALS = [
  { label: '12:12', hours: 12, desc: 'Beginner' },
  { label: '14:10', hours: 14, desc: 'Easy IF' },
  { label: '16:8', hours: 16, desc: 'Standard IF' },
  { label: '18:6', hours: 18, desc: 'Intermediate' },
  { label: '20:4', hours: 20, desc: 'Advanced' },
  { label: '24h', hours: 24, desc: 'OMAD' },
  { label: '36h', hours: 36, desc: 'Extended' },
  { label: '48h', hours: 48, desc: 'Prolonged' },
];

// ============================================================
// STATE
// ============================================================
let state = {
  isFasting: false,
  startTime: null,
  goalHours: 16,
  elapsed: 0,
};

let timerInterval = null;

// ============================================================
// INIT
// ============================================================
function init() {
  loadState();
  renderGoalOptions();
  renderTimeline();
  renderInsights();
  renderHistory();
  updateUI();
  if (state.isFasting) startTick();
}

function loadState() {
  const saved = Storage.get('fast_state');
  if (saved) {
    try {
      const s = JSON.parse(saved);
      state.isFasting = s.isFasting || false;
      state.startTime = s.startTime || null;
      state.goalHours = s.goalHours || 16;
    } catch(e) {}
  }
}

function saveState() {
  Storage.set('fast_state', JSON.stringify({
    isFasting: state.isFasting,
    startTime: state.startTime,
    goalHours: state.goalHours,
  }));
}

// ============================================================
// TIMER LOGIC
// ============================================================
function toggleFast() {
  if (!state.isFasting) {
    state.isFasting = true;
    state.startTime = Date.now();
    saveState();
    startTick();
  } else {
    stopFast();
  }
  updateUI();
}

function stopFast() {
  if (!state.isFasting) return;
  const duration = (Date.now() - state.startTime) / 1000;
  saveFastToHistory(state.startTime, duration);
  state.isFasting = false;
  state.startTime = null;
  clearInterval(timerInterval);
  timerInterval = null;
  saveState();
  updateUI();
  renderHistory();
}

function startTick() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    tick();
  }, 1000);
  tick();
}

function tick() {
  if (!state.isFasting || !state.startTime) return;
  state.elapsed = (Date.now() - state.startTime) / 1000;
  updateTimerDisplay();
  updateRing();
  updatePhase();
  updateInsightsLive();
}

// ============================================================
// DISPLAY
// ============================================================
function formatTime(secs) {
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  const s = Math.floor(secs % 60);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function updateTimerDisplay() {
  document.getElementById('timer-display').textContent = formatTime(state.elapsed);
  const hoursElapsed = state.elapsed / 3600;
  const pct = Math.min(100, (hoursElapsed / state.goalHours) * 100);
  document.getElementById('timer-goal').textContent = `${Math.floor(pct)}% of ${state.goalHours}h goal`;
  document.getElementById('timer-label').textContent = 'elapsed';
}

function updateRing() {
  const hoursElapsed = state.elapsed / 3600;
  const pct = Math.min(1, hoursElapsed / state.goalHours);
  const circumference = 659;
  const offset = circumference - (circumference * pct);
  const ring = document.getElementById('ring-prog');
  ring.style.strokeDashoffset = offset;

  // Color gradient based on progress
  if (pct < 0.33) ring.style.stroke = '#7c6af7';
  else if (pct < 0.66) ring.style.stroke = '#4ecdc4';
  else ring.style.stroke = '#56e39f';
}

function updatePhase() {
  const hoursElapsed = state.elapsed / 3600;
  const phase = getCurrentPhase(hoursElapsed);
  const banner = document.getElementById('phase-banner');
  banner.querySelector('.phase-icon').textContent = phase.icon;
  banner.querySelector('.phase-title').textContent = phase.title;
  banner.querySelector('.phase-desc').textContent = phase.desc;
}

function getCurrentPhase(hours) {
  let current = PHASES[0];
  for (const p of PHASES) {
    if (hours >= p.hour) current = p;
    else break;
  }
  return current;
}

function updateUI() {
  const badge = document.getElementById('status-badge');
  const statusText = document.getElementById('status-text');
  const btn = document.getElementById('main-btn');

  if (state.isFasting) {
    badge.className = 'status-badge fasting';
    statusText.textContent = 'Fasting';
    btn.className = 'btn-main btn-stop';
    btn.textContent = 'Stop Fast';
    updateRing();
    updatePhase();
  } else {
    badge.className = 'status-badge eating';
    statusText.textContent = 'Eating Window';
    btn.className = 'btn-main btn-start';
    btn.textContent = 'Start Fast';
    document.getElementById('timer-display').textContent = '00:00:00';
    document.getElementById('timer-label').textContent = 'tap start to begin';
    document.getElementById('timer-goal').textContent = '';
    document.getElementById('ring-prog').style.strokeDashoffset = '659';
    document.getElementById('ring-prog').style.stroke = '#7c6af7';
    // Reset phase banner
    document.getElementById('phase-banner').querySelector('.phase-icon').textContent = '🍽️';
    document.getElementById('phase-banner').querySelector('.phase-title').textContent = 'Ready to Fast';
    document.getElementById('phase-banner').querySelector('.phase-desc').textContent = 'Start your fast to see real-time biological insights as your body transitions through fasting phases.';
  }

  // Update goal display in picker
  document.querySelectorAll('.goal-opt').forEach(el => {
    el.classList.toggle('selected', parseInt(el.dataset.hours) === state.goalHours);
  });
}

// ============================================================
// GOAL PICKER
// ============================================================
function renderGoalOptions() {
  const container = document.getElementById('goal-options');
  container.innerHTML = GOALS.map(g => `
    <div class="goal-opt ${g.hours === state.goalHours ? 'selected' : ''}"
         data-hours="${g.hours}"
         onclick="setGoal(${g.hours})">
      ${g.label}
    </div>
  `).join('');
}

function setGoal(hours) {
  state.goalHours = hours;
  saveState();
  renderGoalOptions();
  updateUI();
  if (state.isFasting) updateRing();
}

function toggleGoalPicker() {
  const picker = document.getElementById('goal-picker');
  picker.classList.toggle('open');
}

// ============================================================
// INSIGHTS
// ============================================================
function renderTimeline() {
  const markers = [0, 4, 8, 12, 16, 20, 24];
  const container = document.getElementById('tl-markers');
  container.innerHTML = markers.map(h => `
    <div class="t-marker" id="tm-${h}">
      <div class="t-marker-h">${h}h</div>
      <div class="t-marker-dot"></div>
    </div>
  `).join('');
}

function updateInsightsLive() {
  const hoursElapsed = state.elapsed / 3600;
  document.getElementById('insight-time').textContent =
    `${Math.floor(hoursElapsed)}h ${Math.floor((hoursElapsed % 1) * 60)}m`;

  const pct = Math.min(100, (hoursElapsed / 24) * 100);
  document.getElementById('tl-fill').style.width = pct + '%';

  // Update marker states
  [0,4,8,12,16,20,24].forEach(h => {
    const el = document.getElementById(`tm-${h}`);
    if (el) el.classList.toggle('reached', hoursElapsed >= h);
  });

  renderInsightsForHour(hoursElapsed);
}

function renderInsights() {
  const hoursElapsed = state.isFasting ? (state.elapsed / 3600) : 0;
  document.getElementById('insight-time').textContent =
    state.isFasting ? `${Math.floor(hoursElapsed)}h ${Math.floor((hoursElapsed%1)*60)}m` : '0h 0m';
  renderInsightsForHour(hoursElapsed);
}

function renderInsightsForHour(hours) {
  const phase = getCurrentPhase(hours);
  const nextPhase = PHASES.find(p => p.hour > hours);

  document.getElementById('bio-insights').innerHTML = `
    <div class="insight-card bio">
      <div class="insight-icon">🧫</div>
      <div>
        <div class="insight-category">Biological</div>
        <div class="insight-title">${phase.bio.title}</div>
        <div class="insight-body">${phase.bio.body}</div>
      </div>
    </div>
    ${nextPhase ? `
    <div class="insight-card" style="opacity:0.5;margin-top:8px">
      <div class="insight-icon">⏳</div>
      <div>
        <div class="insight-category" style="color:var(--text3)">Next at ${nextPhase.hour}h</div>
        <div class="insight-title" style="color:var(--text2)">${nextPhase.bio.title}</div>
        <div class="insight-body">${nextPhase.bio.body.substring(0,80)}...</div>
      </div>
    </div>` : ''}
  `;

  document.getElementById('mental-insights').innerHTML = `
    <div class="insight-card mental">
      <div class="insight-icon">🧠</div>
      <div>
        <div class="insight-category">Mental</div>
        <div class="insight-title">${phase.mental.title}</div>
        <div class="insight-body">${phase.mental.body}</div>
      </div>
    </div>
  `;

  document.getElementById('physical-insights').innerHTML = `
    <div class="insight-card physical">
      <div class="insight-icon">💪</div>
      <div>
        <div class="insight-category">Physical</div>
        <div class="insight-title">${phase.physical.title}</div>
        <div class="insight-body">${phase.physical.body}</div>
      </div>
    </div>
  `;
}

// ============================================================
// HISTORY
// ============================================================
function saveFastToHistory(startTime, durationSecs) {
  const history = getHistory();
  history.unshift({
    id: Date.now(),
    startTime,
    duration: durationSecs,
    goalHours: state.goalHours,
  });
  if (history.length > 50) history.pop();
  Storage.set('fast_history', JSON.stringify(history));
}

function getHistory() {
  const raw = Storage.get('fast_history');
  if (!raw) return [];
  try { return JSON.parse(raw); } catch(e) { return []; }
}

function renderHistory() {
  const history = getHistory();
  const container = document.getElementById('history-content');

  if (history.length === 0) {
    container.innerHTML = `
      <div class="history-empty">
        <div class="big-icon">🕐</div>
        <div>No fasts recorded yet</div>
        <div style="font-size:12px;color:var(--text3)">Complete a fast to see your history here</div>
      </div>
    `;
    return;
  }

  // Stats
  const totalFasts = history.length;
  const avgDuration = history.reduce((a,b) => a + b.duration, 0) / totalFasts;
  const longest = Math.max(...history.map(h => h.duration));
  const streak = calcStreak(history);

  container.innerHTML = `
    <div class="streak-banner">
      <div>
        <div class="streak-num">${streak}</div>
        <div class="streak-label">day streak 🔥</div>
      </div>
      <div style="flex:1"></div>
      <div style="text-align:right">
        <div style="font-size:12px;color:var(--text3)">Total fasts</div>
        <div style="font-family:'Space Mono',monospace;font-size:22px;color:var(--text)">${totalFasts}</div>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value">${Math.floor(avgDuration/3600)}<span class="stat-unit">h</span></div>
        <div class="stat-label">Avg Duration</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${Math.floor(longest/3600)}<span class="stat-unit">h</span></div>
        <div class="stat-label">Longest Fast</div>
      </div>
    </div>

    <div class="section-title">Recent Fasts</div>
    ${history.slice(0,20).map(fast => {
      const h = Math.floor(fast.duration / 3600);
      const m = Math.floor((fast.duration % 3600) / 60);
      const date = new Date(fast.startTime);
      const dateStr = date.toLocaleDateString('en-US', {month:'short',day:'numeric',year:'numeric'});
      const goal = fast.goalHours || 16;
      const pct = fast.duration / (goal * 3600);
      const badge = pct >= 1 ? {cls:'great',label:'Goal ✓'} : pct >= 0.75 ? {cls:'good',label:'75%+'} : {cls:'ok',label:`${Math.floor(pct*100)}%`};
      return `
        <div class="history-item">
          <div>
            <div class="h-date">${dateStr}</div>
            <div class="h-duration">${h}h ${m}m</div>
          </div>
          <div class="h-badge ${badge.cls}">${badge.label}</div>
        </div>
      `;
    }).join('')}
  `;
}

function calcStreak(history) {
  if (history.length === 0) return 0;
  let streak = 0;
  const today = new Date();
  today.setHours(0,0,0,0);
  let checking = new Date(today);

  for (let i = 0; i < history.length; i++) {
    const fastDate = new Date(history[i].startTime);
    fastDate.setHours(0,0,0,0);
    const diff = Math.round((checking - fastDate) / 86400000);
    if (diff === 0 || diff === 1) {
      streak++;
      checking = fastDate;
    } else {
      break;
    }
  }
  return streak;
}

// ============================================================
// NAVIGATION
// ============================================================
function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.getElementById('nav-' + name).classList.add('active');

  if (name === 'insights') {
    renderInsights();
    if (state.isFasting) {
      const hoursElapsed = state.elapsed / 3600;
      const pct = Math.min(100, (hoursElapsed / 24) * 100);
      document.getElementById('tl-fill').style.width = pct + '%';
      renderTimeline();
      [0,4,8,12,16,20,24].forEach(h => {
        const el = document.getElementById(`tm-${h}`);
        if (el) el.classList.toggle('reached', hoursElapsed >= h);
      });
    }
  }
  if (name === 'history') renderHistory();
}

// ============================================================
// BOOT
// ============================================================
init();
</script>
